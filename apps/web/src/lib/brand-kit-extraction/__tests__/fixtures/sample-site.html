<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme Robotics — Build the future &amp; beyond</title>
    <meta property="og:site_name" content="Acme Robotics" />
    <meta property="og:image" content="https://cdn.acme.test/social/og-card.png" />
    <meta name="theme-color" content="#0f4c81" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/assets/main.css" />
    <link rel="stylesheet" href="https://cdn.other-origin.test/vendor.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;700"
    />
    <style>
      body {
        font-family: "Inter", -apple-system, sans-serif;
        color: rgb(31, 41, 55);
        background: #f7f3ec;
      }
      h1,
      h2 {
        font-family: "Playfair Display", Georgia, serif;
        color: #123456;
      }
      .btn {
        background-color: #e0592a;
        color: #fff;
        border: 1px solid #e0592a;
      }
      .muted {
        color: rgba(0, 0, 0, 0.2); /* low-alpha noise — should be filtered */
      }
      .icon {
        font-family: "Font Awesome 6 Free";
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/img/acme-logo.svg" alt="Acme Robotics logo" class="site-logo" />
      <nav style="background: #0f4c81; color: #ffffff">
        <a href="/products" style="color: #e0592a">Products</a>
      </nav>
    </header>
    <main>
      <h1>Robots for everyone</h1>
      <p style="color: rgb(31, 41, 55)">We build friendly robots.</p>
      <img src="/img/hero-photo.jpg" alt="A friendly robot" />
    </main>
  </body>
</html>
