<!doctype html>
<html>
  <head>
    <style>
      .hero { background-image: url("https://fixtures.flock.test/hero.png"); background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #26140c; }
      .hero-copy { color: #ffffff; font-family: Georgia, serif; font-size: 28px; line-height: 36px; text-align: center; padding: 36px 48px; }
      .cta { background-color: #ffffff; color: #26140c; font-family: Arial, sans-serif; font-weight: 700; padding: 14px 24px; }
    </style>
  </head>
  <body>
    <table role="presentation" width="640" bgcolor="#26140c">
      <tr>
        <td class="hero">
          <table role="presentation" width="100%">
            <tr><td align="center"><a href="https://example.com"><img src="https://fixtures.flock.test/logo.png" width="96" alt="Northstar Coffee"></a></td></tr>
            <tr><td class="hero-copy">A warmer way to welcome autumn.</td></tr>
            <tr><td align="center"><a class="cta" href="https://example.com/order">Order now</a></td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
