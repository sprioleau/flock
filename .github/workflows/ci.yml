name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm comes from corepack (pinned by package.json's packageManager
      # field) — third-party actions are disallowed by the GHE pre-receive
      # policy, so pnpm/action-setup can't be used here.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before Build on purpose: apps/web's typecheck script shells out to
      # `next typegen` first, so the generated PageProps/LayoutProps helpers in
      # .next/types exist even on a clean checkout.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Placeholder on purpose: prerendering only needs a syntactically
          # valid address to construct the Convex client — CI never connects to
          # a deployment, so no real URL (or secret) belongs here.
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
